name: Deploy to Production

on:
  push:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
        run: |
          python manage.py test --verbosity=2

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout code (for consistency)
        uses: actions/checkout@v4

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy to server
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SERVER_IP }} -p ${{ secrets.SSH_PORT }} << 'EOF'
          echo "Начинаем деплой..."

          cd /home/ubuntu/homework-on-django-rest

          
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}

        
          export DEBUG=False
          export SECRET_KEY=${{ secrets.SECRET_KEY }}
          export DB_NAME=${{ secrets.DB_NAME }}
          export DB_USER=${{ secrets.DB_USER }}
          export DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          
          export CELERY_BROKER_URL=redis://localhost:6379/0
          export CELERY_RESULT_BACKEND=redis://localhost:6379/0
          export DEFAULT_FROM_EMAIL=test@lms.ru

        
          source .venv/bin/activate

          
          pip install -r requirements.txt

          
          python manage.py migrate --noinput

          
          python manage.py collectstatic --noinput

        
          sudo systemctl restart lms-web
          sudo systemctl restart lms-celery-worker
          sudo systemctl restart lms-celery-beat

          echo "Деплой завершён успешно!"
          EOF